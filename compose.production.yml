name: source-web-console-${ENV_NAME}

services:
    cache:
        init: true
        image: valkey/valkey:8
        restart: unless-stopped
        command: >
            --requirepass ${CACHE_PASSWORD}
            --maxmemory 96mb
            --maxmemory-policy allkeys-lru
        volumes:
            - valkey_data:/data
        security_opt:
            - no-new-privileges=true
        healthcheck:
            test: valkey-cli --raw incr ping
            retries: 3
            timeout: 5s
        deploy:
            resources:
                limits:
                    pids: 16
                    cpus: "0.5"
                    memory: 128M

    database:
        init: true
        image: mariadb:12
        restart: unless-stopped
        command: --collation-server=utf8mb4_unicode_ci
        volumes:
            - mariadb_data:/var/lib/mysql
        environment:
            TZ: ${TZ}
            MARIADB_DATABASE: ${DATABASE_NAME}
            MARIADB_USER: ${DATABASE_USERNAME}
            MARIADB_PASSWORD: ${DATABASE_PASSWORD}
            MARIADB_AUTO_UPGRADE: true
            MARIADB_INITDB_SKIP_TZINFO: true
            MARIADB_RANDOM_ROOT_PASSWORD: true
        security_opt:
            - no-new-privileges=true
        healthcheck:
            test: healthcheck.sh --su-mysql --connect --innodb_initialized
            retries: 3
            timeout: 5s
            start_period: 30s
        deploy:
            resources:
                limits:
                    pids: 64
                    cpus: "0.5"
                    memory: 256M

    migration:
        init: true
        user: "${UID:-1000}:${GID:-1000}"
        image: registry.florian-dev.fr:443/floriantrayon/source-web-console:${VERSION:-latest}-${ENV_NAME}
        restart: "no"
        command: >
            sh -c "/usr/local/bin/php bin/console doctrine:database:create --no-interaction --if-not-exists
            && /usr/local/bin/php bin/console doctrine:schema:update --force"
        volumes:
            - ./logs:/var/www/html/logs
        env_file: .env
        cap_drop:
            - ALL
        depends_on:
            database:
                condition: service_healthy
        security_opt:
            - no-new-privileges=true
        deploy:
            resources:
                limits:
                    pids: 16
                    cpus: "0.5"
                    memory: 128M

    udp:
        init: true
        user: "${UID:-1000}:${GID:-1000}"
        image: registry.florian-dev.fr:443/floriantrayon/source-web-console:${VERSION:-latest}-${ENV_NAME}
        restart: unless-stopped
        command: /usr/local/bin/php bin/console app:udp-server 0.0.0.0:8443
        volumes:
            - ./logs:/var/www/html/logs
        env_file: .env
        cap_drop:
            - ALL
        depends_on:
            migration:
                condition: service_completed_successfully
        security_opt:
            - no-new-privileges=true
        deploy:
            resources:
                limits:
                    pids: 16
                    cpus: "0.5"
                    memory: 128M
        ports:
            - "${UDP_PORT:-8443}:8443/udp"

    server:
        init: true
        user: "${UID:-1000}:${GID:-1000}"
        image: registry.florian-dev.fr:443/floriantrayon/source-web-console:${VERSION:-latest}-${ENV_NAME}
        restart: unless-stopped
        command: frankenphp run --config /etc/frankenphp/Caddyfile
        volumes:
            - ./logs:/var/www/html/logs
        env_file: .env
        cap_drop:
            - ALL
        depends_on:
            cache:
                condition: service_healthy
            migration:
                condition: service_completed_successfully
        security_opt:
            - no-new-privileges=true
        healthcheck:
            test: curl -f http://localhost:8080/
            retries: 3
            timeout: 5s
            start_period: 30s
        deploy:
            resources:
                limits:
                    pids: 64
                    cpus: "1"
                    memory: 256M
        build:
            target: production
            context: .
            dockerfile: ./docker/Dockerfile
        ports:
            - "${SERVER_PORT:-8080}:8080"

volumes:
    valkey_data:
    mariadb_data:

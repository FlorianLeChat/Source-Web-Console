name: source-web-console

services:
    cache:
        image: valkey/valkey:8
        command: >
            --requirepass ${CACHE_PASSWORD}
            --maxmemory 128mb
            --maxmemory-policy allkeys-lru
        volumes:
            - valkey_data:/data
        healthcheck:
            test: valkey-cli --raw incr ping
            retries: 3
            timeout: 5s
            start_period: 30s

    database:
        image: mariadb:12
        command: --collation-server=utf8mb4_unicode_ci
        volumes:
            - mariadb_data:/var/lib/mysql
        environment:
            TZ: ${TZ}
            MARIADB_DATABASE: ${DATABASE_NAME}
            MARIADB_USER: ${DATABASE_USERNAME}
            MARIADB_PASSWORD: ${DATABASE_PASSWORD}
            MARIADB_AUTO_UPGRADE: true
            MARIADB_INITDB_SKIP_TZINFO: true
            MARIADB_RANDOM_ROOT_PASSWORD: true
        healthcheck:
            test: healthcheck.sh --su-mysql --connect --innodb_initialized
            retries: 3
            timeout: 5s
            start_period: 30s

    migration:
        image: source-web-console
        command: >
            sh -c "composer install --no-interaction
            && /usr/local/bin/php bin/console doctrine:database:create --no-interaction --if-not-exists
            && /usr/local/bin/php bin/console doctrine:schema:update --force"
        volumes: &app_volumes
            - .:/var/www/html:cached
            - /var/www/html/.git
            - /var/www/html/node_modules
            - cache_data:/var/www/html/var
            - vendor_data:/var/www/html/vendor
        depends_on:
            cache:
                condition: service_healthy
            database:
                condition: service_healthy
        build:
            target: development
            context: .
            dockerfile: ./docker/Dockerfile

    scheduler:
        image: source-web-console
        command: /usr/local/bin/php bin/console messenger:consume scheduler_default --time-limit=3600 --memory-limit=96M
        volumes: *app_volumes
        depends_on:
            cache:
                condition: service_healthy
            migration:
                condition: service_completed_successfully

    udp:
        image: source-web-console
        command: /usr/local/bin/php bin/console app:udp-server 0.0.0.0:8443
        volumes: *app_volumes
        depends_on:
            migration:
                condition: service_completed_successfully
        ports:
            - "${UDP_PORT:-8443}:8443/udp"

    server:
        image: source-web-console
        command: symfony server:start --allow-all-ip
        volumes: *app_volumes
        depends_on:
            cache:
                condition: service_healthy
            migration:
                condition: service_completed_successfully
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: curl -f http://localhost:8000/
            retries: 3
            timeout: 5s
            start_period: 30s
        build:
            target: development
            context: .
            dockerfile: ./docker/Dockerfile
        ports:
            - "8000:8000"

volumes:
    cache_data:
    vendor_data:
    valkey_data:
    mariadb_data:

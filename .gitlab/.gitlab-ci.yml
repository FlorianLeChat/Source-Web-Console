stages:
    - cache
    - lint
    - bundle
    - test
    - build
    - analyze
    - deploy

default:
    cache:
        key:
            files:
                - composer.lock
                - package-lock.json
        paths:
            - .npm
            - .composer/cache
        policy: pull-push

variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer/cache"

cache:npm:
    image: node:22-alpine
    stage: cache
    script:
        - npm ci --cache .npm --prefer-offline --no-audit

cache:composer:
    image: php:8.2-cli-alpine
    stage: cache
    script:
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip @composer
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts

lint:eslint:
    stage: lint
    image: node:22-alpine
    before_script:
        - npm ci --cache .npm --prefer-offline --no-audit
    script:
        - npm run lint
    artifacts:
        when: always
        reports:
            codequality: gl-codequality.json
        expire_in: 1 hour

lint:phpcs:
    image: php:8.2-cli-alpine
    stage: lint
    before_script:
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip @composer
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts
    script:
        - vendor/bin/phpcs -s

lint:phpstan:
    image: php:8.2-cli-alpine
    stage: lint
    before_script:
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip @composer
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts
    script:
        - vendor/bin/phpstan analyse --memory-limit=-1 --error-format=gitlab | tee phpstan-report.json
    artifacts:
        when: always
        reports:
            codequality: phpstan-report.json
        expire_in: 1 hour

lint:phpmd:
    image: php:8.2-cli-alpine
    stage: lint
    before_script:
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip @composer
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts
    script:
        - vendor/bin/phpmd src gitlab phpmd.xml | tee phpmd-report.json
    artifacts:
        when: always
        reports:
            codequality: phpmd-report.json
        expire_in: 1 hour

bundle:assets:
    stage: bundle
    image: node:22-alpine
    before_script:
        - npm ci --cache .npm --prefer-offline --no-audit
    script:
        - npm run build
    artifacts:
        paths:
            - public/build/
        expire_in: 1 hour

test:phpunit:
    image: php:8.2-cli-alpine
    stage: test
    variables:
        XDEBUG_MODE: coverage
    before_script:
        - apk add --no-cache unzip
        - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
        - chmod +x /usr/local/bin/install-php-extensions
        - install-php-extensions zip bcmath intl xdebug @composer
        - composer install --prefer-dist --no-progress --no-interaction --no-scripts
        - mkdir var
        - touch var/data.db
        - php bin/console --env=test doctrine:schema:create --no-interaction
        - php bin/console --env=test doctrine:fixtures:load --no-interaction
    script:
        - vendor/bin/phpunit -c phpunit.xml --coverage-text --coverage-clover=coverage.xml --colors=never --log-junit phpunit-report.xml
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
    artifacts:
        when: always
        paths:
            - coverage.xml
            - phpunit-report.xml
        reports:
            junit: phpunit-report.xml
        expire_in: 1 hour

.build:project:
    stage: build
    image: alpine:3
    before_script:
        - apk add --no-cache zip
        - mv $ENV_FILE .env
        - echo "" >> .env
        - echo "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" >> .env
        - echo "ENV_NAME=${CI_ENVIRONMENT_NAME}" >> .env
        - echo "SESSION_COOKIE_PATH=${SESSION_COOKIE_PATH}" >> .env
    script:
        - mv compose.production.yml compose.yml
        - zip -r project.zip .env compose.yml
    artifacts:
        paths:
            - .env
            - .gitlab/ansible/
            - compose.yml
            - project.zip
        access: none
        expire_in: 1 hour
    dependencies: []

build:project:test:
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH
          when: manual
    extends: .build:project
    variables:
        SESSION_COOKIE_PATH: "/swc/"
    environment:
        name: test
        action: prepare

build:project:production:
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: manual
    extends: .build:project
    variables:
        SESSION_COOKIE_PATH: "/"
    environment:
        name: production
        action: prepare

.build:docker:
    stage: build
    image: docker:29
    services:
        - docker:29-dind-rootless
    variables:
        DOCKER_TLS_CERTDIR: "/certs"
    script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
        - docker compose build
        - docker compose push

build:docker:test:
    needs:
        - build:project:test
    extends: .build:docker

build:docker:production:
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: on_success
    needs:
        - build:project:production
    extends: .build:docker

analyze:sast:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/semgrep
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-sast-report.json
        reports:
            sast: gl-sast-report.json
        expire_in: 1 hour
    dependencies: []

analyze:iac:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/kics
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-sast-report.json
        reports:
            sast: gl-sast-report.json
        expire_in: 1 hour
    dependencies: []

analyze:secret-detection:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/secrets
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-secret-detection-report.json
        reports:
            secret_detection: gl-secret-detection-report.json
        expire_in: 1 hour
    dependencies: []

analyze:docker-container:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/container-scanning
    needs:
        - job: build:docker:test
          artifacts: false
    script:
        - export CI_APPLICATION_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}-test"
        - gtcs scan
    variables:
        CS_DOCKERFILE_PATH: docker/Dockerfile
        CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE
    artifacts:
        access: developer
        paths:
            - gl-container-scanning-report.json
        reports:
            container_scanning: gl-container-scanning-report.json
        expire_in: 1 hour
    dependencies: []

.deploy:ansible:
    stage: deploy
    image: alpine:3
    variables:
        GIT_STRATEGY: none
    resource_group: $CI_ENVIRONMENT_NAME
    before_script:
        - apk add --no-cache openssl openssh-client ansible
        - eval $(ssh-agent -s)
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan -H 10.0.0.22 >> ~/.ssh/known_hosts
        - echo $ANSIBLE_VAULT_PASSWORD > .vault_password.txt
    script:
        - ansible-playbook -i .gitlab/ansible/hosts.yml --vault-password-file .vault_password.txt -e "application_path=$APPLICATION_PATH" .gitlab/ansible/deploy.yml

deploy:test:
    extends: .deploy:ansible
    variables:
        APPLICATION_PATH: "/var/www/internal.florian-dev.fr/swc"
    environment:
        name: test
        url: https://internal.florian-dev.fr/swc/
    dependencies:
        - build:project:test

deploy:production:
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: on_success
    extends: .deploy:ansible
    variables:
        APPLICATION_PATH: "/var/www/console.florian-dev.fr"
    environment:
        name: production
        url: https://console.florian-dev.fr
    dependencies:
        - build:project:production

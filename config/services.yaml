parameters:
    app.version: "%env(VERSION)%"
    app.timezone: "%env(TZ)%"
    app.ssl_phrase: "%env(SSL_PHRASE)%"
    app.recaptcha_enabled: "%env(RECAPTCHA_ENABLED)%"
    app.recaptcha_private_key: "%env(RECAPTCHA_PRIVATE_KEY)%"
    app.google_client_enabled: "%env(GOOGLE_CLIENT_ENABLED)%"
    app.github_client_enabled: "%env(GITHUB_CLIENT_ENABLED)%"
    app.udp_host: "%env(UDP_HOST)%"
    app.udp_port: "%env(int:UDP_PORT)%"
    env(VERSION): "0.0.1"
    env(UDP_HOST): ""
    env(UDP_PORT): "8443"
    env(SESSION_COOKIE_PATH): "/"
    .container.dumper.inline_factories: true

services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        exclude:
            - "../src/Entity"
            - "../src/Kernel.php"
            - "../src/DataFixtures"
            - "../src/DependencyInjection"
        resource: "../src/"
    App\Twig\AppRuntime:
        tags: ["twig.runtime"]
        arguments: ["@translator"]
    xPaw\SourceQuery\SourceQuery:
        tags: [{ name: "kernel.reset", method: "Disconnect" }]
    App\EventSubscriber\LocaleSubscriber:
        arguments: ["%kernel.default_locale%"]
    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments:
            - "@Redis"
            - { "prefix": "swc_sessions_" }
    Redis:
        class: Redis
        factory: ["Symfony\\Component\\Cache\\Adapter\\RedisAdapter", "createConnection"]
        arguments:
            - "redis://%env(CACHE_HOST)%:6379"
            - { lazy: true, auth: ["%env(CACHE_USERNAME)%", "%env(CACHE_PASSWORD)%"] }

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\:
            exclude:
                - "../src/Entity"
                - "../src/Kernel.php"
                - "../src/DependencyInjection"
            resource: "../src/"
        App\Service\StorageManager:
            class: App\Tests\Mock\FakeStorageManager
        xPaw\SourceQuery\SourceQuery:
            class: App\Tests\Mock\FakeSourceQuery
            tags: [{ name: "kernel.reset", method: "Disconnect" }]
        Symfony\Component\Mailer\MailerInterface:
            class: App\Tests\Mock\FakeMailer
        App\Tests\Mock\HttpClientResponseFactory: ~
